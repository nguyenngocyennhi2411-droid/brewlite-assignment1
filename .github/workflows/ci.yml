
name: BrewLite CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  api:
    name: API CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build
