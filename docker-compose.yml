
services:
  db:
    image: postgres:17
    container_name: brewlite-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: brewlite

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - brewlite_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brewlite_pgdata:
